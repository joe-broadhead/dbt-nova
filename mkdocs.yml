    - Analyst: personas/analyst.md
    - Engineer: personas/engineer.md
    - Governance: personas/governance.md
  - Configuration:
    - Reference: configuration/reference.md
    - Manifest Sources: configuration/manifest-sources.md
    - Search Defaults: configuration/search-defaults.md
    - Tuning: configuration/tuning.md
  - API:
