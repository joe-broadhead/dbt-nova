name: Monthly

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: monthly-fuzz-nightly
          cache-all-crates: true

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131
        with:
          tool: cargo-fuzz@0.12.0

      - name: Run Fuzz Targets (short)
        run: |
          cargo fuzz run \
            --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu \
            manifest_entity \
            -- -max_total_time=60

  deny:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Install cargo-deny
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131
        with:
          tool: cargo-deny@0.19.0

      - name: Validate advisory ignore expiry metadata
        run: scripts/check_advisory_ignores.sh

      - name: Validate dependency watchlist metadata/state
        run: scripts/check_dependency_watchlist.sh

      - name: Cargo Deny
        run: cargo deny check
