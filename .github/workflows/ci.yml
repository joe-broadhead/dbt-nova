name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Test
        run: cargo test --locked --all-features

  macos-smoke:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Test native macOS library path
        run: cargo test --locked --no-default-features --lib

      - name: Smoke DuckDB provider on macOS
        run: cargo test --locked --no-default-features --test duckdb_provider execute_sql_tool_path_uses_duckdb_provider

      - name: Smoke CLI binary on macOS
        run: cargo run --locked --no-default-features -- --version

  msrv:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.93.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Check MSRV (all features)
        run: cargo check --locked --all-features

  search-eval-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Search Eval Smoke
        run: |
          DBT_NOVA_EVAL_ENABLE_HYBRID=0 \
          DBT_NOVA_EVAL_ALLOW_EMBEDDING_DOWNLOAD=0 \
          DBT_NOVA_EVAL_ENABLE_LIFECYCLE=0 \
          cargo test --locked --no-default-features --test search_eval compare_lexical_vs_hybrid_search_quality -- --ignored

  lexical-scale:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Lexical Scale Guard
        run: scripts/check_lexical_scale.sh

  module-size:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Module Size Ratchet
        run: scripts/check_module_size.sh

  tokenomics-bridge-eval:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Validate Packaged Eval Suites
        run: |
          set -euo pipefail
          for suite in evals/*.yml; do
            cargo run --locked --no-default-features -- eval validate --suite "$suite"
          done

      - name: Run Tokenomics Bridge Eval
        run: |
          cargo run --locked --no-default-features -- eval run \
            --suite evals/agent-tokenomics-bridge.yml \
            --manifest-path tests/fixtures/tokenomics_manifest.json \
            --storage-instance-id tokenomics-bridge-ci \
            --cleanup-storage-on-start \
            --fail-under 1.0 \
            --json

  check-no-default:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Check (no default features)
        run: cargo check --locked --no-default-features --all-targets

  config-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Verify generated config reference
        run: scripts/check_config_reference.sh

  coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
      COVERAGE_MIN_LINES: "70"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-targets: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131
        with:
          tool: cargo-llvm-cov

      - name: Coverage Summary
        run: |
          cargo llvm-cov \
            --locked \
            --all-features \
            --workspace \
            --summary-only \
            --fail-under-lines "${COVERAGE_MIN_LINES}"

  docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Docs
        run: mkdocs build --strict

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Build container image
        run: docker build -t dbt-nova:ci .

      - name: Smoke container binary
        run: docker run --rm --entrypoint /usr/local/bin/dbt-nova dbt-nova:ci --version

  deny:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Install cargo-deny
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131
        with:
          tool: cargo-deny@0.19.0

      - name: Validate advisory ignore expiry metadata
        run: scripts/check_advisory_ignores.sh

      - name: Validate dependency watchlist metadata/state
        run: scripts/check_dependency_watchlist.sh

      - name: Cargo Deny
        run: cargo deny check advisories licenses sources

  reusable-assets-producer:
    name: reusable-assets-producer
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/nova-build-assets.yml
    with:
      runner: ubuntu-22.04
      manifest_path: tests/fixtures/nova_manifest.json
      storage_instance_id: ci-readonly-smoke
      artifact_name_prefix: ci-readonly-smoke
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}

  reusable-assets-semantic-producer:
    name: reusable-assets-semantic-producer
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/nova-build-assets.yml
    with:
      manifest_path: tests/fixtures/nova_manifest.json
      storage_instance_id: ci-semantic-smoke
      artifact_name_prefix: ci-semantic-smoke
      models_distribution_mode: publish_and_bootstrap
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}

  reusable-assets-producer-structured-dbt:
    name: reusable-assets-producer-structured-dbt
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/nova-build-assets.yml
    with:
      dbt_generate_manifest: true
      dbt_executable: python3
      dbt_allow_unsafe_executable: true
      dbt_command_args_json: >-
        ["-c","from pathlib import Path; Path('target').mkdir(exist_ok=True); Path('target/manifest.json').write_text(Path('tests/fixtures/nova_manifest.json').read_text(encoding='utf-8'), encoding='utf-8')"]
      storage_instance_id: ci-structured-dbt-smoke
      artifact_name_prefix: ci-structured-dbt-smoke
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}

  reusable-assets-producer-trusted-dbt:
    name: reusable-assets-producer-trusted-dbt
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/nova-build-assets.yml
    with:
      dbt_generate_manifest: true
      dbt_command: |
        set -euo pipefail
        mkdir -p target
        cp tests/fixtures/nova_manifest.json target/manifest.json
      storage_instance_id: ci-trusted-dbt-smoke
      artifact_name_prefix: ci-trusted-dbt-smoke
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}

  reusable-metadata-audit-project:
    name: reusable-metadata-audit-project
    permissions:
      contents: read
    uses: ./.github/workflows/nova-metadata-audit.yml
    with:
      runner_labels_json: '["ubuntu-22.04"]'
      manifest_path: tests/fixtures/nova_manifest.json
      storage_instance_id: ci-metadata-audit-project
      artifact_name_prefix: ci-metadata-audit-project
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}
      selection_mode: project
      resource_types_json: '["model"]'
      personas_json: '["engineer"]'
      thresholds_json: '{}'

  reusable-metadata-audit-changed:
    name: reusable-metadata-audit-changed
    permissions:
      contents: read
    uses: ./.github/workflows/nova-metadata-audit.yml
    with:
      manifest_path: tests/fixtures/nova_manifest.json
      storage_instance_id: ci-metadata-audit-changed
      artifact_name_prefix: ci-metadata-audit-changed
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}
      selection_mode: changed
      changed_files_json: '["models/staging/traffic/stg__traffic_sessions.sql"]'
      resource_types_json: '["model"]'
      personas_json: '["engineer","analyst"]'
      thresholds_json: '{"entity":{"engineer":{"min_score":0,"severity":"required"},"analyst":{"min_score":0,"severity":"advisory"}}}'

  reusable-metadata-audit-structured-dbt:
    name: reusable-metadata-audit-structured-dbt
    permissions:
      contents: read
    uses: ./.github/workflows/nova-metadata-audit.yml
    with:
      dbt_generate_manifest: true
      dbt_executable: python3
      dbt_allow_unsafe_executable: true
      dbt_command_args_json: >-
        ["-c","from pathlib import Path; Path('target').mkdir(exist_ok=True); Path('target/manifest.json').write_text(Path('tests/fixtures/nova_manifest.json').read_text(encoding='utf-8'), encoding='utf-8')"]
      storage_instance_id: ci-metadata-audit-structured
      artifact_name_prefix: ci-metadata-audit-structured
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}
      selection_mode: changed
      changed_files_json: '["models/staging/traffic/stg__traffic_sessions.sql"]'
      thresholds_json: '{"entity":{"engineer":{"min_score":0,"severity":"required"}}}'

  reusable-metadata-audit-trusted-dbt:
    name: reusable-metadata-audit-trusted-dbt
    permissions:
      contents: read
    uses: ./.github/workflows/nova-metadata-audit.yml
    with:
      dbt_generate_manifest: true
      dbt_command: |
        set -euo pipefail
        mkdir -p target
        cp tests/fixtures/nova_manifest.json target/manifest.json
      storage_instance_id: ci-metadata-audit-trusted
      artifact_name_prefix: ci-metadata-audit-trusted
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}
      selection_mode: entities
      entity_ids_json: '["model.nova_test.stg__traffic_sessions"]'
      thresholds_json: '{"entity":{"engineer":{"min_score":0,"severity":"required"}}}'

  reusable-assets-remote-publish-dryrun:
    name: reusable-assets-remote-publish-dryrun
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/nova-build-assets.yml
    with:
      manifest_path: tests/fixtures/nova_manifest.json
      storage_instance_id: ci-remote-publish-dryrun
      artifact_name_prefix: ci-remote-publish-dryrun
      retention_days: 1
      installer_repository: ${{ github.repository }}
      installer_ref: ${{ github.sha }}
      publish_targets: s3,gcs,dbfs
      publish_s3_prefix: s3://ci-dryrun-bucket/dbt-nova
      publish_gcs_prefix: gs://ci-dryrun-bucket/dbt-nova
      publish_dbfs_prefix: dbfs:/ci-dryrun/dbt-nova
      publish_dry_run: true

  reusable-assets-remote-publish-dryrun-assert:
    name: reusable-assets-remote-publish-dryrun-assert
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: reusable-assets-remote-publish-dryrun
    steps:
      - name: Ensure jq is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download dry-run publish summary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.reusable-assets-remote-publish-dryrun.outputs.artifact_name_publish_summary }}
          path: dryrun-publish-summary

      - name: Assert dry-run publish outputs are populated per target
        shell: bash
        env:
          PUBLISHED_TARGETS: ${{ needs.reusable-assets-remote-publish-dryrun.outputs.published_targets }}
        run: |
          set -euo pipefail

          summary_path="$(find dryrun-publish-summary -type f -name '*.json' | head -n 1)"
          test -f "${summary_path}" || {
            echo "missing publish summary artifact content"
            exit 1
          }

          published_targets="${PUBLISHED_TARGETS}"
          storage_uris="$(jq -c '.published_storage_uris' "${summary_path}")"
          manifest_uris="$(jq -c '.published_manifest_uris' "${summary_path}")"
          metadata_uris="$(jq -c '.published_metadata_uris' "${summary_path}")"
          bootstrap_uris="$(jq -c '.published_bootstrap_uris' "${summary_path}")"
          models_uris="$(jq -c '.published_models_uris' "${summary_path}")"
          summary_targets="$(jq -r '.published_targets' "${summary_path}")"

          echo "published_targets=${published_targets}"
          echo "summary_targets=${summary_targets}"
          echo "published_storage_uris=${storage_uris}"
          echo "published_manifest_uris=${manifest_uris}"
          echo "published_metadata_uris=${metadata_uris}"
          echo "published_bootstrap_uris=${bootstrap_uris}"
          echo "published_models_uris=${models_uris}"
          test "${summary_targets}" = "${published_targets}"

          test -n "${published_targets}"
          normalized_targets="$(
            printf '%s\n' "${published_targets}" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sort -u \
            | paste -sd, -
          )"
          test "${normalized_targets}" = "dbfs,gcs,s3"

          echo "${storage_uris}" | jq -e 'keys | sort == ["dbfs", "gcs", "s3"]' >/dev/null
          echo "${manifest_uris}" | jq -e 'keys | sort == ["dbfs", "gcs", "s3"]' >/dev/null
          echo "${metadata_uris}" | jq -e 'keys | sort == ["dbfs", "gcs", "s3"]' >/dev/null
          echo "${bootstrap_uris}" | jq -e 'keys | sort == ["dbfs", "gcs", "s3"]' >/dev/null
          echo "${models_uris}" | jq -e '. == {}' >/dev/null

  reusable-assets-readonly-consumer:
    name: reusable-assets-readonly-consumer
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: reusable-assets-producer
    env:
      STORAGE_INSTANCE_ID: ci-readonly-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build dbt-nova CLI binary
        run: cargo build --locked --bin dbt-nova

      - name: Ensure jq is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate default remote publish outputs
        shell: bash
        env:
          PUBLISHED_TARGETS: ${{ needs.reusable-assets-producer.outputs.published_targets }}
          PUBLISHED_STORAGE_URIS: ${{ needs.reusable-assets-producer.outputs.published_storage_uris }}
          PUBLISHED_METADATA_URIS: ${{ needs.reusable-assets-producer.outputs.published_metadata_uris }}
          PUBLISHED_MODELS_URIS: ${{ needs.reusable-assets-producer.outputs.published_models_uris }}
        run: |
          set -euo pipefail
          test -z "${PUBLISHED_TARGETS}"
          test "${PUBLISHED_STORAGE_URIS}" = '{}'
          test "${PUBLISHED_METADATA_URIS}" = '{}'
          test "${PUBLISHED_MODELS_URIS}" = '{}'

      - name: Download publish summary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.reusable-assets-producer.outputs.artifact_name_publish_summary }}
          path: consumer-artifacts/publish-summary

      - name: Validate default publish summary artifact
        shell: bash
        run: |
          set -euo pipefail
          summary_path="$(find consumer-artifacts/publish-summary -type f -name '*.json' | head -n 1)"
          test -f "${summary_path}" || {
            echo "missing publish summary artifact json"
            exit 1
          }
          jq -e '.published_targets == ""' "${summary_path}" >/dev/null
          jq -e '.published_storage_uris == {}' "${summary_path}" >/dev/null
          jq -e '.published_manifest_uris == {}' "${summary_path}" >/dev/null
          jq -e '.published_metadata_uris == {}' "${summary_path}" >/dev/null
          jq -e '.published_bootstrap_uris == {}' "${summary_path}" >/dev/null
          jq -e '.published_models_uris == {}' "${summary_path}" >/dev/null

      - name: Download storage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.reusable-assets-producer.outputs.artifact_name_storage }}
          path: consumer-artifacts/storage

      - name: Download metadata artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.reusable-assets-producer.outputs.artifact_name_metadata }}
          path: consumer-artifacts/metadata

      - name: Extract artifact into fresh workspace
        id: workspace
        shell: bash
        env:
          STORAGE_ARTIFACT_NAME: ${{ needs.reusable-assets-producer.outputs.artifact_name_storage }}
        run: |
          set -euo pipefail

          consumer_workspace="$(mktemp -d)"
          storage_archive="consumer-artifacts/storage/${STORAGE_ARTIFACT_NAME}.tar.gz"
          metadata_path="consumer-artifacts/metadata/nova-build-metadata.json"

          test -f "${storage_archive}" || {
            echo "missing storage archive: ${storage_archive}"
            exit 1
          }
          test -f "${metadata_path}" || {
            echo "missing metadata file: ${metadata_path}"
            exit 1
          }

          tar -C "${consumer_workspace}" -xzf "${storage_archive}"
          storage_dir="${consumer_workspace}/dbt-nova-storage"
          test -d "${storage_dir}" || {
            echo "missing extracted storage directory: ${storage_dir}"
            exit 1
          }

          # Keep filesystem permissions normal so runtime lock/read paths can execute.
          # Read-only safety is asserted by byte-for-byte storage snapshot comparison.
          cp tests/fixtures/nova_manifest.json "${consumer_workspace}/manifest.json"
          # Hash only persisted reusable artifacts. Tantivy lock/managed files can change
          # during read-only opens without indicating index rebuild or data mutation.
          storage_snapshot_before="$(
            (
              cd "${storage_dir}"
              find . -type f \
                \( \
                  -name 'entities.bin' -o \
                  -name 'entities.idx' -o \
                  -name 'entities.checksum.json' -o \
                  -name 'indexes.rkyv' -o \
                  -name 'manifest.signature.json' -o \
                  -name 'manifest.current.json' \
                \) \
                -print0 | sort -z | xargs -0 sha256sum
            ) | sha256sum | awk '{print $1}'
          )"

          {
            echo "workspace_dir=${consumer_workspace}"
            echo "storage_dir=${storage_dir}"
            echo "metadata_path=${metadata_path}"
            echo "storage_snapshot_before=${storage_snapshot_before}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate metadata contract fields
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg storage_instance_id "${STORAGE_INSTANCE_ID}" '
            .contract_version == "v1" and
            (.storage_instance_id == $storage_instance_id) and
            (.manifest_hash | type == "string" and length > 0) and
            (.manifest_version | type == "string" and length > 0) and
            (.entity_count | type == "number" and . >= 0) and
            (.dbt_nova_version | type == "string" and length > 0) and
            (.artifact_name_storage | type == "string" and length > 0)
          ' "${{ steps.workspace.outputs.metadata_path }}" >/dev/null

      - name: Read-only health check succeeds from reusable artifact
        shell: bash
        env:
          DBT_NOVA_STORAGE_DIR: ${{ steps.workspace.outputs.storage_dir }}
          DBT_NOVA_STORAGE_INSTANCE_ID: ${{ env.STORAGE_INSTANCE_ID }}
          DBT_NOVA_STORAGE_READ_ONLY: "true"
        run: |
          set -euo pipefail
          ./target/debug/dbt-nova health check \
            --manifest-path "${{ steps.workspace.outputs.workspace_dir }}/manifest.json" \
            --json | tee "${{ steps.workspace.outputs.workspace_dir }}/health.json"

          jq -e '.status == "success"' "${{ steps.workspace.outputs.workspace_dir }}/health.json" >/dev/null
          jq -e '.data.status == "ready" and .data.ready_for_traffic == true' "${{ steps.workspace.outputs.workspace_dir }}/health.json" >/dev/null

      - name: Read-only tool call succeeds without rebuild
        shell: bash
        env:
          DBT_NOVA_STORAGE_DIR: ${{ steps.workspace.outputs.storage_dir }}
          DBT_NOVA_STORAGE_INSTANCE_ID: ${{ env.STORAGE_INSTANCE_ID }}
          DBT_NOVA_STORAGE_READ_ONLY: "true"
        run: |
          set -euo pipefail
          ./target/debug/dbt-nova tool call show_metadata \
            --params-json '{}' \
            --manifest-path "${{ steps.workspace.outputs.workspace_dir }}/manifest.json" \
            --storage-instance-id "${STORAGE_INSTANCE_ID}" \
            --read-only \
            --json | tee "${{ steps.workspace.outputs.workspace_dir }}/show-metadata.json"

          jq -e '.status == "success"' "${{ steps.workspace.outputs.workspace_dir }}/show-metadata.json" >/dev/null

      - name: Assert storage bytes unchanged in read-only mode
        shell: bash
        run: |
          set -euo pipefail
          storage_snapshot_after="$(
            (
              cd "${{ steps.workspace.outputs.storage_dir }}"
              find . -type f \
                \( \
                  -name 'entities.bin' -o \
                  -name 'entities.idx' -o \
                  -name 'entities.checksum.json' -o \
                  -name 'indexes.rkyv' -o \
                  -name 'manifest.signature.json' -o \
                  -name 'manifest.current.json' \
                \) \
                -print0 | sort -z | xargs -0 sha256sum
            ) | sha256sum | awk '{print $1}'
          )"
          test "${storage_snapshot_after}" = "${{ steps.workspace.outputs.storage_snapshot_before }}" || {
            echo "storage content changed during read-only consumer execution"
            exit 1
          }

  reusable-assets-remote-consumer-smoke:
    name: reusable-assets-remote-consumer-smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: reusable-assets-producer
    env:
      STORAGE_INSTANCE_ID: ci-readonly-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build dbt-nova CLI binary
        run: cargo build --locked --bin dbt-nova

      - name: Ensure jq is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download storage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.reusable-assets-producer.outputs.artifact_name_storage }}
          path: remote-consumer-artifacts/storage

      - name: Download metadata artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.reusable-assets-producer.outputs.artifact_name_metadata }}
          path: remote-consumer-artifacts/metadata

      - name: Prepare file URI smoke workspace
        id: remote_workspace
        shell: bash
        env:
          STORAGE_ARTIFACT_NAME: ${{ needs.reusable-assets-producer.outputs.artifact_name_storage }}
        run: |
          set -euo pipefail

          workspace_dir="$(mktemp -d)"
          storage_root="${workspace_dir}/nova-storage"
          mkdir -p "${storage_root}"

          storage_archive="remote-consumer-artifacts/storage/${STORAGE_ARTIFACT_NAME}.tar.gz"
          metadata_path="remote-consumer-artifacts/metadata/nova-build-metadata.json"
          test -f "${storage_archive}"
          test -f "${metadata_path}"

          manifest_path="${workspace_dir}/manifest.json"
          cp tests/fixtures/nova_manifest.json "${manifest_path}"

          storage_uri="file://$(realpath "${storage_archive}")"
          metadata_uri="file://$(realpath "${metadata_path}")"

          {
            echo "workspace_dir=${workspace_dir}"
            echo "storage_root=${storage_root}"
            echo "manifest_path=${manifest_path}"
            echo "storage_uri=${storage_uri}"
            echo "metadata_uri=${metadata_uri}"
          } >> "$GITHUB_OUTPUT"

      - name: First run materializes from file URIs
        shell: bash
        env:
          DBT_NOVA_STORAGE_DIR: ${{ steps.remote_workspace.outputs.storage_root }}
          DBT_NOVA_STORAGE_INSTANCE_ID: ${{ env.STORAGE_INSTANCE_ID }}
          DBT_NOVA_STORAGE_ARTIFACT_URI: ${{ steps.remote_workspace.outputs.storage_uri }}
          DBT_NOVA_METADATA_ARTIFACT_URI: ${{ steps.remote_workspace.outputs.metadata_uri }}
          DBT_NOVA_ARTIFACT_FETCH_POLICY: if_missing
        run: |
          set -euo pipefail
          ./target/debug/dbt-nova health check \
            --manifest-path "${{ steps.remote_workspace.outputs.manifest_path }}" \
            --json | tee "${{ steps.remote_workspace.outputs.workspace_dir }}/remote-health-first.json"

          jq -e '.status == "success"' "${{ steps.remote_workspace.outputs.workspace_dir }}/remote-health-first.json" >/dev/null
          jq -e '.data.artifact_consumer.enabled == true' "${{ steps.remote_workspace.outputs.workspace_dir }}/remote-health-first.json" >/dev/null
          jq -e '.data.artifact_consumer.metadata_validated == true' "${{ steps.remote_workspace.outputs.workspace_dir }}/remote-health-first.json" >/dev/null
          jq -e '.data.artifact_consumer.storage_materialized == true' "${{ steps.remote_workspace.outputs.workspace_dir }}/remote-health-first.json" >/dev/null

      - name: Second run reuses local storage under if_missing
        shell: bash
        env:
          DBT_NOVA_STORAGE_DIR: ${{ steps.remote_workspace.outputs.storage_root }}
