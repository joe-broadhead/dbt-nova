name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-22.04
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Search Eval Smoke
        run: |
          DBT_NOVA_EVAL_ENABLE_HYBRID=0 \
          DBT_NOVA_EVAL_ALLOW_EMBEDDING_DOWNLOAD=0 \
          DBT_NOVA_EVAL_ENABLE_LIFECYCLE=0 \
          cargo test --locked --test search_eval compare_lexical_vs_hybrid_search_quality -- --ignored

      - name: Check (no default features)
        run: cargo check --locked --no-default-features --all-targets

  config-contract:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Verify generated config reference
        run: scripts/check_config_reference.sh

  coverage:
    runs-on: ubuntu-22.04
    env:
      DBT_NOVA_STRICT_SCHEMA: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131
        with:
          tool: cargo-llvm-cov

      - name: Coverage Summary
        run: cargo llvm-cov --locked --all-features --workspace --summary-only

  docs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Docs
        run: mkdocs build --strict

  deny:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Install cargo-deny
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131
        with:
          tool: cargo-deny@0.19.0

      - name: Validate advisory ignore expiry metadata
        run: scripts/check_advisory_ignores.sh

      - name: Validate dependency watchlist metadata/state
        run: scripts/check_dependency_watchlist.sh

      - name: Cargo Deny
        run: cargo deny check advisories licenses sources
