name: Build Nova Assets

on:
  workflow_call:
    inputs:
      manifest_path:
        description: "Path to manifest.json in the caller repository"
        required: false
        type: string
        default: ""
      manifest_uri:
        description: "Remote manifest URI (file/http(s)/s3/gs/dbfs)"
        required: false
        type: string
        default: ""
      storage_instance_id:
        description: "Stable storage instance id used by producers/consumers"
        required: true
        type: string
      dbt_generate_manifest:
        description: "Whether to run dbt before building Nova assets"
        required: false
        type: boolean
        default: false
      dbt_command:
        description: "dbt command to generate the manifest when enabled"
        required: false
        type: string
        default: ""
      include_models_cache:
        description: "Publish an additional models-cache artifact"
        required: false
        type: boolean
        default: false
      artifact_name_prefix:
        description: "Prefix used when naming output artifacts"
        required: false
        type: string
        default: "dbt-nova-index"
      retention_days:
        description: "Artifact retention period in days (1-90)"
        required: false
        type: number
        default: 14
    outputs:
      manifest_hash:
        description: "Manifest content hash (populated by producer build in follow-up step)"
        value: ${{ jobs.build.outputs.manifest_hash }}
      manifest_version:
        description: "Manifest version directory (populated by producer build in follow-up step)"
        value: ${{ jobs.build.outputs.manifest_version }}
      entity_count:
        description: "Entity count loaded from manifest (populated by producer build in follow-up step)"
        value: ${{ jobs.build.outputs.entity_count }}
      artifact_name_storage:
        description: "Planned storage artifact name"
        value: ${{ jobs.build.outputs.artifact_name_storage }}
      artifact_name_models:
        description: "Planned models artifact name (empty when include_models_cache=false)"
        value: ${{ jobs.build.outputs.artifact_name_models }}
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path to manifest.json in the caller repository"
        required: false
        type: string
        default: ""
      manifest_uri:
        description: "Remote manifest URI (file/http(s)/s3/gs/dbfs)"
        required: false
        type: string
        default: ""
      storage_instance_id:
        description: "Stable storage instance id used by producers/consumers"
        required: true
        type: string
      dbt_generate_manifest:
        description: "Whether to run dbt before building Nova assets"
        required: false
        type: boolean
        default: false
      dbt_command:
        description: "dbt command to generate the manifest when enabled"
        required: false
        type: string
        default: ""
      include_models_cache:
        description: "Publish an additional models-cache artifact"
        required: false
        type: boolean
        default: false
      artifact_name_prefix:
        description: "Prefix used when naming output artifacts"
        required: false
        type: string
        default: "dbt-nova-index"
      retention_days:
        description: "Artifact retention period in days (1-90)"
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  prepare:
    name: Validate inputs and define contract outputs
    runs-on: ubuntu-22.04
    outputs:
      artifact_name_storage: ${{ steps.resolve.outputs.artifact_name_storage }}
      artifact_name_models: ${{ steps.resolve.outputs.artifact_name_models }}
      storage_dir: ${{ steps.resolve.outputs.storage_dir }}
      models_dir: ${{ steps.resolve.outputs.models_dir }}
      manifest_path: ${{ steps.resolve.outputs.manifest_path }}
      manifest_uri: ${{ steps.resolve.outputs.manifest_uri }}
      storage_instance_id: ${{ steps.resolve.outputs.storage_instance_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate inputs and set deterministic paths
        id: resolve
        shell: bash
        env:
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_MANIFEST_URI: ${{ inputs.manifest_uri }}
          INPUT_STORAGE_INSTANCE_ID: ${{ inputs.storage_instance_id }}
          INPUT_DBT_GENERATE_MANIFEST: ${{ inputs.dbt_generate_manifest }}
          INPUT_DBT_COMMAND: ${{ inputs.dbt_command }}
          INPUT_INCLUDE_MODELS_CACHE: ${{ inputs.include_models_cache }}
          INPUT_ARTIFACT_NAME_PREFIX: ${{ inputs.artifact_name_prefix }}
          INPUT_RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail

          manifest_path="${INPUT_MANIFEST_PATH}"
          manifest_uri="${INPUT_MANIFEST_URI}"
          storage_instance_id="${INPUT_STORAGE_INSTANCE_ID}"
          dbt_generate_manifest="${INPUT_DBT_GENERATE_MANIFEST}"
          dbt_command="${INPUT_DBT_COMMAND}"
          include_models_cache="${INPUT_INCLUDE_MODELS_CACHE}"
          artifact_name_prefix="${INPUT_ARTIFACT_NAME_PREFIX}"
          retention_days="${INPUT_RETENTION_DAYS}"

          if [[ -z "${storage_instance_id}" ]]; then
            echo "storage_instance_id is required."
            exit 1
          fi
          if [[ ! "${storage_instance_id}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "storage_instance_id must match ^[A-Za-z0-9._-]+$"
            exit 1
          fi

          if [[ -z "${manifest_path}" && -z "${manifest_uri}" && "${dbt_generate_manifest}" != "true" ]]; then
            echo "Provide manifest_path or manifest_uri, or set dbt_generate_manifest=true."
            exit 1
          fi
          if [[ -n "${manifest_path}" && -n "${manifest_uri}" ]]; then
            echo "Provide only one of manifest_path or manifest_uri."
            exit 1
          fi
          if [[ "${dbt_generate_manifest}" == "true" && -z "${dbt_command}" ]]; then
            echo "dbt_generate_manifest=true requires dbt_command."
            exit 1
          fi

          if [[ ! "${artifact_name_prefix}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "artifact_name_prefix must match ^[A-Za-z0-9._-]+$"
            exit 1
          fi

          if ! [[ "${retention_days}" =~ ^[0-9]+$ ]]; then
            echo "retention_days must be an integer between 1 and 90."
            exit 1
          fi
          if (( retention_days < 1 || retention_days > 90 )); then
            echo "retention_days must be between 1 and 90."
            exit 1
          fi

          storage_dir="${GITHUB_WORKSPACE}/out/dbt-nova-storage"
          models_dir="${GITHUB_WORKSPACE}/out/dbt-nova-models"
          mkdir -p "${storage_dir}" "${models_dir}"

          run_suffix="${GITHUB_RUN_ID}"
          artifact_name_storage="${artifact_name_prefix}-storage-${run_suffix}"
          artifact_name_models=""
          if [[ "${include_models_cache}" == "true" ]]; then
            artifact_name_models="${artifact_name_prefix}-models-${run_suffix}"
          fi

          echo "artifact_name_storage=${artifact_name_storage}" >> "$GITHUB_OUTPUT"
          echo "artifact_name_models=${artifact_name_models}" >> "$GITHUB_OUTPUT"
          echo "storage_dir=${storage_dir}" >> "$GITHUB_OUTPUT"
          echo "models_dir=${models_dir}" >> "$GITHUB_OUTPUT"
          echo "manifest_path=${manifest_path}" >> "$GITHUB_OUTPUT"
          echo "manifest_uri=${manifest_uri}" >> "$GITHUB_OUTPUT"
          echo "storage_instance_id=${storage_instance_id}" >> "$GITHUB_OUTPUT"

      - name: Summarize contract
        shell: bash
        run: |
          {
            echo "### Reusable Workflow Contract"
            echo ""
            echo "- storage_dir: \`${{ steps.resolve.outputs.storage_dir }}\`"
            echo "- models_dir: \`${{ steps.resolve.outputs.models_dir }}\`"
            echo "- artifact_name_storage: \`${{ steps.resolve.outputs.artifact_name_storage }}\`"
            echo "- artifact_name_models: \`${{ steps.resolve.outputs.artifact_name_models }}\`"
            echo "- storage_instance_id: \`${{ steps.resolve.outputs.storage_instance_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, validate, and publish storage artifact
    runs-on: ubuntu-22.04
    needs: prepare
    outputs:
      manifest_hash: ${{ steps.collect.outputs.manifest_hash }}
      manifest_version: ${{ steps.collect.outputs.manifest_version }}
      entity_count: ${{ steps.collect.outputs.entity_count }}
      artifact_name_storage: ${{ steps.collect.outputs.artifact_name_storage }}
      artifact_name_models: ${{ steps.collect.outputs.artifact_name_models }}
    env:
      DBT_NOVA_STORAGE_DIR: ${{ needs.prepare.outputs.storage_dir }}
      DBT_NOVA_EMBEDDINGS_CACHE_DIR: ${{ needs.prepare.outputs.models_dir }}
      DBT_NOVA_STORAGE_INSTANCE_ID: ${{ needs.prepare.outputs.storage_instance_id }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install jq
        shell: bash
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install dbt-nova
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_ACTION_REPOSITORY:-joe-broadhead/dbt-nova}"
          ref="${GITHUB_ACTION_REF:-master}"
          install_url="https://raw.githubusercontent.com/${repo}/${ref}/scripts/install.sh"
          if ! curl -fsSL "${install_url}" | bash; then
            echo "Falling back to install script from joe-broadhead/dbt-nova@master"
            curl -fsSL "https://raw.githubusercontent.com/joe-broadhead/dbt-nova/master/scripts/install.sh" | bash
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Optionally generate manifest via dbt
        if: ${{ inputs.dbt_generate_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          eval "${{ inputs.dbt_command }}"

      - name: Run manifest load + smoke validations
        id: collect
        shell: bash
        env:
          INPUT_MANIFEST_PATH: ${{ needs.prepare.outputs.manifest_path }}
          INPUT_MANIFEST_URI: ${{ needs.prepare.outputs.manifest_uri }}
          INPUT_INCLUDE_MODELS_CACHE: ${{ inputs.include_models_cache }}
          INPUT_ARTIFACT_NAME_STORAGE: ${{ needs.prepare.outputs.artifact_name_storage }}
          INPUT_ARTIFACT_NAME_MODELS: ${{ needs.prepare.outputs.artifact_name_models }}
        run: |
          set -euo pipefail
          mkdir -p out

          manifest_path="${INPUT_MANIFEST_PATH}"
          manifest_uri="${INPUT_MANIFEST_URI}"
          if [[ -z "${manifest_path}" && -z "${manifest_uri}" ]]; then
            manifest_path="target/manifest.json"
          fi

          manifest_args=()
          if [[ -n "${manifest_uri}" ]]; then
            manifest_args+=(--manifest-uri "${manifest_uri}")
          else
            manifest_args+=(--manifest-path "${manifest_path}")
          fi

          dbt-nova manifest load "${manifest_args[@]}" --storage-instance-id "${DBT_NOVA_STORAGE_INSTANCE_ID}" --json | tee out/manifest-load.json
          jq -e '.status == "success"' out/manifest-load.json >/dev/null

          manifest_hash="$(jq -r '.data.manifest_hash // empty' out/manifest-load.json)"
          manifest_version="$(jq -r '.data.manifest_version // empty' out/manifest-load.json)"
          entity_count="$(jq -r '.data.entity_count // 0' out/manifest-load.json)"
          if [[ -z "${manifest_hash}" || -z "${manifest_version}" ]]; then
            echo "manifest load output missing manifest_hash/manifest_version"
            exit 1
          fi
          hash_short="${manifest_hash:0:12}"

          dbt-nova health check "${manifest_args[@]}" --json | tee out/health.json
          jq -e '.status == "success"' out/health.json >/dev/null
          jq -e '.data.status == "ready" or .data.status == "refreshing"' out/health.json >/dev/null

          dbt-nova tool call show_metadata --params-json '{}' "${manifest_args[@]}" --storage-instance-id "${DBT_NOVA_STORAGE_INSTANCE_ID}" --json | tee out/show-metadata.json
          jq -e '.status == "success"' out/show-metadata.json >/dev/null

          artifact_name_storage="${INPUT_ARTIFACT_NAME_STORAGE}-${hash_short}"
          artifact_name_models=""
          if [[ "${INPUT_INCLUDE_MODELS_CACHE}" == "true" ]]; then
            artifact_name_models="${INPUT_ARTIFACT_NAME_MODELS}-${hash_short}"
          fi

          echo "manifest_hash=${manifest_hash}" >> "$GITHUB_OUTPUT"
          echo "manifest_version=${manifest_version}" >> "$GITHUB_OUTPUT"
          echo "entity_count=${entity_count}" >> "$GITHUB_OUTPUT"
          echo "artifact_name_storage=${artifact_name_storage}" >> "$GITHUB_OUTPUT"
          echo "artifact_name_models=${artifact_name_models}" >> "$GITHUB_OUTPUT"

      - name: Package storage directory
        shell: bash
        run: |
          set -euo pipefail
          storage_archive="${{ steps.collect.outputs.artifact_name_storage }}.tar.gz"
          tar -C "$(dirname "${DBT_NOVA_STORAGE_DIR}")" -czf "${storage_archive}" "$(basename "${DBT_NOVA_STORAGE_DIR}")"

      - name: Upload storage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name_storage }}
          path: ${{ steps.collect.outputs.artifact_name_storage }}.tar.gz
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      - name: Package models directory
        if: ${{ inputs.include_models_cache }}
        shell: bash
        run: |
          set -euo pipefail
          models_archive="${{ steps.collect.outputs.artifact_name_models }}.tar.gz"
          tar -C "$(dirname "${DBT_NOVA_EMBEDDINGS_CACHE_DIR}")" -czf "${models_archive}" "$(basename "${DBT_NOVA_EMBEDDINGS_CACHE_DIR}")"

      - name: Upload models artifact
        if: ${{ inputs.include_models_cache }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name_models }}
          path: ${{ steps.collect.outputs.artifact_name_models }}.tar.gz
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
