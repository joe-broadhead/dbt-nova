name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example: v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Flow
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
    permissions:
      contents: read
    steps:
      - name: Resolve tag
        id: resolve_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${INPUT_TAG}"
          fi
          if ! [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${release_tag}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Fetch master and tag
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.release_tag }}
        run: |
          git fetch --no-tags origin master
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Ensure tag is on master
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.release_tag }}
        run: |
          TAG_COMMIT="$(git rev-list -n1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "Release tags must point to a commit on master."
            exit 1
          fi

      - name: Checkout release tag
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.release_tag }}
        run: git checkout --detach "${RELEASE_TAG}"

      - name: Ensure crate metadata matches tag
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          cargo_toml="$(git show "${RELEASE_TAG}:Cargo.toml")"
          changelog="$(git show "${RELEASE_TAG}:CHANGELOG.md")"
          cargo_version="$(awk -F'"' '/^version = "/ { print $2; exit }' <<< "${cargo_toml}")"

          if [ "${cargo_version}" != "${release_version}" ]; then
            echo "Cargo.toml version (${cargo_version}) does not match release tag (${release_version})."
            exit 1
          fi

          if ! grep -q "^## \[${release_version}\]" <<< "${changelog}"; then
            echo "CHANGELOG.md is missing a ## [${release_version}] entry."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Test (all features)
        run: cargo test --locked --all-features

  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: validate
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            ext: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            asset: macos-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          targets: ${{ matrix.target }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with:
          cosign-release: "v2.4.1"

      - name: Extract release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          awk -v version="${release_version}" '
            index($0, "## [" version "]") == 1 { in_release=1; next }
            /^## \[/ && in_release { exit }
            in_release { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Failed to extract release notes for ${release_version} from CHANGELOG.md."
            exit 1
          fi

      - name: Build (release, all features)
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: cargo build --locked --release --all-features --target "${TARGET_TRIPLE}"

      - name: Smoke native release binary
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          BIN_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          "target/${TARGET_TRIPLE}/release/dbt-nova${BIN_EXT}" --version

      - name: Package
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.asset }}
          BIN_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET_TRIPLE}/release/dbt-nova${BIN_EXT}"
          mkdir -p dist/slim
          cp "$BIN" dist/slim/

          tar -C dist/slim -czf "dbt-nova-${ASSET_NAME}.tar.gz" "dbt-nova${BIN_EXT}"
          shasum -a 256 "dbt-nova-${ASSET_NAME}.tar.gz" > "dbt-nova-${ASSET_NAME}.sha256"
          for artifact in \
            "dbt-nova-${ASSET_NAME}.tar.gz" \
            "dbt-nova-${ASSET_NAME}.sha256"
          do
            COSIGN_EXPERIMENTAL=1 COSIGN_YES=1 cosign sign-blob \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.crt" \
              "$artifact"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: dbt-nova-${{ matrix.asset }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dbt-nova-${{ matrix.asset }}.tar.gz
            dbt-nova-${{ matrix.asset }}.sha256
            dbt-nova-${{ matrix.asset }}.sbom.spdx.json

      - name: Publish release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          files: |
            dbt-nova-${{ matrix.asset }}.tar.gz
            dbt-nova-${{ matrix.asset }}.sha256
            dbt-nova-${{ matrix.asset }}.tar.gz.sig
            dbt-nova-${{ matrix.asset }}.tar.gz.crt
            dbt-nova-${{ matrix.asset }}.sha256.sig
            dbt-nova-${{ matrix.asset }}.sha256.crt
            dbt-nova-${{ matrix.asset }}.sbom.spdx.json

  container:
    name: Publish OCI image
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs:
      - validate
      - build
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          commit_sha="$(git rev-list -n1 "${RELEASE_TAG}")"
          {
            echo "image=${image}"
            echo "commit_sha=${commit_sha}"
            echo "amd64_tag=${image}:sha-${commit_sha}-amd64"
            echo "arm64_tag=${image}:sha-${commit_sha}-arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.release_tag }}
            type=raw,value=sha-${{ steps.image.outputs.commit_sha }}
          labels: |
            org.opencontainers.image.title=dbt-nova
            org.opencontainers.image.description=dbt-nova streamable HTTP MCP server image
            org.opencontainers.image.version=${{ needs.validate.outputs.release_tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with:
          cosign-release: "v2.4.1"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Prepare OCI binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          rm -rf dist/oci
          rm -f dbt-nova-linux-x86_64.tar.gz dbt-nova-linux-arm64.tar.gz
          mkdir -p dist/oci/linux-amd64 dist/oci/linux-arm64

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "dbt-nova-linux-x86_64.tar.gz" \
            --pattern "dbt-nova-linux-arm64.tar.gz"

          tar -xzf dbt-nova-linux-x86_64.tar.gz -C dist/oci/linux-amd64
          tar -xzf dbt-nova-linux-arm64.tar.gz -C dist/oci/linux-arm64
          chmod 0755 dist/oci/linux-amd64/dbt-nova dist/oci/linux-arm64/dbt-nova

      - name: Build exact release image
        shell: bash
        env:
          AMD64_IMAGE: ${{ steps.image.outputs.amd64_tag }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r label; do
            if [ -n "${label}" ]; then
              label_args+=(--label "${label}")
            fi
          done <<< "${IMAGE_LABELS}"
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.oci \
            --build-arg TARGETARCH=amd64 \
            "${label_args[@]}" \
            -t dbt-nova:release-smoke \
            -t "${AMD64_IMAGE}" \
            .

      - name: Smoke HTTP container
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f dbt-nova-release-smoke >/dev/null 2>&1 || true
          trap 'docker logs dbt-nova-release-smoke || true; docker rm -f dbt-nova-release-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --rm \
            --name dbt-nova-release-smoke \
            -p 127.0.0.1:8080:8080 \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -e DBT_MANIFEST_PATH=/fixtures/nova_manifest.json \
            -e PORT=8080 \
            -e DBT_NOVA_HTTP_EXPECT_AUTH_PROXY=true \
            -e DBT_NOVA_TOOL_DENYLIST=execute_sql,run_recipe,show_config,validate_config,inspect_storage,prune_storage,cleanup_storage,warm_manifest \
            -e DBT_NOVA_SEARCH_ENABLE_VECTOR=false \
            -e DBT_NOVA_SEARCH_ENABLE_SPARSE=false \
            -e DBT_NOVA_SEARCH_ENABLE_RERANKER=false \
            dbt-nova:release-smoke

          health_ok=0
          ready_ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz > /tmp/dbt-nova-healthz.json; then
              health_ok=1
            fi
            if curl -fsS http://127.0.0.1:8080/readyz > /tmp/dbt-nova-readyz.json; then
              if grep -q '"status":"ready"' /tmp/dbt-nova-readyz.json; then
                ready_ok=1
                break
              fi
            fi
            sleep 1
          done

          test "$health_ok" -eq 1
          test "$ready_ok" -eq 1

      - name: Scan smoke-tested image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: dbt-nova:release-smoke
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: json
          output: dbt-nova-oci-trivy.json
          exit-code: "0"
          timeout: 10m

      - name: Gate smoke-tested image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: dbt-nova:release-smoke
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"
          timeout: 10m

      - name: Publish OCI scan report
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          overwrite_files: true
          files: dbt-nova-oci-trivy.json

      - name: Push smoke-tested AMD64 image
        shell: bash
        env:
          AMD64_IMAGE: ${{ steps.image.outputs.amd64_tag }}
        run: |
          set -euo pipefail
          docker push "${AMD64_IMAGE}"

      - name: Build and push ARM64 image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.oci
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.arm64_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TARGETARCH=arm64
          provenance: false

      - name: Publish multi-arch manifest
        id: manifest
        shell: bash
        env:
          AMD64_IMAGE: ${{ steps.image.outputs.amd64_tag }}
          ARM64_IMAGE: ${{ steps.image.outputs.arm64_tag }}
          IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          COMMIT_SHA: ${{ steps.image.outputs.commit_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            --tag "${IMAGE}:sha-${COMMIT_SHA}" \
            "${AMD64_IMAGE}" \
            "${ARM64_IMAGE}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" | awk '/^Digest:/ { print $2; exit }')"
          if [ -z "${digest}" ]; then
            echo "Failed to resolve OCI manifest digest."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Publish OCI provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Sign OCI manifest digest
        shell: bash
        env:
          COSIGN_YES: "1"
          DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: cosign sign "${IMAGE}@${DIGEST}"
