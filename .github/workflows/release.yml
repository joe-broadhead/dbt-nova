name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example: v0.0.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate Release Flow
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
    permissions:
      contents: read
    steps:
      - name: Resolve tag
        id: resolve_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${INPUT_TAG}"
          fi
          if ! [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${release_tag}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Fetch master and tag
        run: |
          git fetch --no-tags origin master
          git fetch --tags origin

      - name: Ensure tag is on master
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.release_tag }}
        run: |
          TAG_COMMIT="$(git rev-list -n1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "Release tags must point to a commit on master."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Test (all features)
        run: cargo test --locked --all-features

  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            asset: macos-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          targets: ${{ matrix.target }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with:
          cosign-release: "v2.4.1"

      - name: Build (release, all features)
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: cargo build --locked --release --all-features --target "${TARGET_TRIPLE}"

      - name: Package
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.asset }}
          BIN_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET_TRIPLE}/release/dbt-nova${BIN_EXT}"
          mkdir -p dist/slim
          cp "$BIN" dist/slim/

          tar -C dist/slim -czf "dbt-nova-${ASSET_NAME}.tar.gz" "dbt-nova${BIN_EXT}"
          shasum -a 256 "dbt-nova-${ASSET_NAME}.tar.gz" > "dbt-nova-${ASSET_NAME}.sha256"
          for artifact in \
            "dbt-nova-${ASSET_NAME}.tar.gz" \
            "dbt-nova-${ASSET_NAME}.sha256"
          do
            COSIGN_EXPERIMENTAL=1 COSIGN_YES=1 cosign sign-blob \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.crt" \
              "$artifact"
          done

      - name: Publish build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dbt-nova-${{ matrix.asset }}.tar.gz
            dbt-nova-${{ matrix.asset }}.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          files: |
            dbt-nova-${{ matrix.asset }}.tar.gz
            dbt-nova-${{ matrix.asset }}.sha256
            dbt-nova-${{ matrix.asset }}.tar.gz.sig
            dbt-nova-${{ matrix.asset }}.tar.gz.crt
            dbt-nova-${{ matrix.asset }}.sha256.sig
            dbt-nova-${{ matrix.asset }}.sha256.crt
